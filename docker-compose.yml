version: '3.8'

services:

  # ─── MongoDB (optional: use this if NOT using Atlas) ──────────────────────────
  # Uncomment if you want a local MongoDB instead of Atlas
  # mongo:
  #   image: mongo:7-jammy
  #   container_name: capitalcoin_mongo
  #   restart: unless-stopped
  #   volumes:
  #     - mongo_data:/data/db
  #   networks:
  #     - capitalcoin_network

  # ─── Backend (Node/Express API) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: capitalcoin_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "127.0.0.1:5000:5000"       # Only accessible locally; Nginx proxies externally
    networks:
      - capitalcoin_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ─── Frontend (Next.js) ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # ── These NEXT_PUBLIC_* vars are baked into the Next.js build ──
        - NEXT_PUBLIC_API_URL=https://capitalcointrade.com/api
        - NEXT_PUBLIC_WS_URL=wss://capitalcointrade.com/ws/market
        - NEXT_PUBLIC_APP_URL=https://capitalcointrade.com
        - NEXT_PUBLIC_APP_NAME=CapitalCoinTrade
        - NEXT_PUBLIC_BRAND_NAME=CapitalCoinTrade
        - NEXT_PUBLIC_ENABLE_FOREX=true
        - NEXT_PUBLIC_ENABLE_CRYPTO=true
        - NEXT_PUBLIC_ENABLE_STOCKS=false
        - NEXT_PUBLIC_ENABLE_COMMODITIES=false
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=549140765646-o9moh3qhl9qcl4gbakadbd190dm4avc0.apps.googleusercontent.com
        - NEXT_PUBLIC_SUPPORT_EMAIL=support@capitalcointrade.com
        - NEXT_PUBLIC_SUPPORT_PHONE=+1 (555) 123-4567
        - NEXT_PUBLIC_DEFAULT_LEVERAGE=1
        - NEXT_PUBLIC_MAX_LEVERAGE=100
        - NEXT_PUBLIC_MIN_TRADE_AMOUNT=10
        - NEXT_PUBLIC_MAX_TRADE_AMOUNT=10000
        - NEXT_PUBLIC_CHART_THEME=dark
        - NEXT_PUBLIC_DEFAULT_CHART_INTERVAL=1h
        - NEXT_PUBLIC_CHART_LIBRARY=lightweight
        - NEXT_PUBLIC_MAX_FILE_SIZE=5242880
        - NEXT_PUBLIC_ALLOWED_FILE_TYPES=image/jpeg,image/png,image/jpg,application/pdf
    container_name: capitalcoin_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"       # Only accessible locally; Nginx proxies externally
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - capitalcoin_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',(r)=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  backend_uploads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/capitalcointrade/uploads   # persistent path on host

networks:
  capitalcoin_network:
    driver: bridge